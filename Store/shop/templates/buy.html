<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy</title>
        <style>
        .text_center {
            text-align: center;
        }

        body {
            margin: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
         }

        .PaymentBox {
            border: 2px solid black;
            width: 350px;
            border-radius: 5px;

            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            padding: 10px;
        }

        .row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        button {
            background: white;

            padding: 2px 15px;

            align-self: center;

            border-style: solid;
            border-color: black;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Payment Details</h1>
    
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p style="color:green;">{{ success }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div class="PaymentBox">

            <div class="row">
                <label for="Name">Name: </label>
                <input type="text", id="Name", name="name">
            </div>

            <div class="row">
                <label for="Email">Email: </label>
                <input type="text", id="Email", name="email">
            </div>
            
            <button id="submit">Confirm</button>
        </div>
    </form>
</body>
</html>
